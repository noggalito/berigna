# Core package metadata and developer tooling. The desktop application (GTK, translations,
# desktop integration) will be built with Meson from Phase 3 on (ADR-0010).

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "berigna"
version = "0.3.1"
description = "Firma y verificación digital con el DNIe peruano para GNU/Linux"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "noggalito", email = "berigna@noggalito.com" }]
# Production installs come from Debian 13 packages (ADR-0013, SPK-05); these bounds follow
# those versions. pyHanko is pinned: 0.25.3 needs pyhanko-certvalidator>=0.26.5, newer than
# Debian's 0.26.3. pyhanko-certvalidator stays below 0.27 because pyHanko 0.25.1 asks for
# <0.27 and fails to import with 0.30 (Debian testing, R-15); its floor is Debian 13's 0.26.3.
# scripts/verificar-dependencias.py checks these bounds in the CI (DP-19, R-DES-16).
dependencies = [
    "cryptography>=42",
    "pyscard>=2.2",
    "pyhanko==0.25.1",
    "pyhanko-certvalidator~=0.26.3",
    "asn1crypto~=1.5",
    "requests>=2.31",
    "lxml>=5",
    "signxml~=4.0",
    "reportlab>=4",
    "pillow>=10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"berigna.core" = ["fonts/*.ttf", "fonts/OFL-*"]
"berigna.core.trust" = ["anchors/*.pem", "anchors/manifest.json", "tsl/*.crt"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Phase 0 prototypes, kept as they were for the record (docs/10-investigacion); not linted.
extend-exclude = ["spikes"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# Developer scripts: they assert their own invariants and call system tools by name (git,
# xwd, dpkg-query); the product code keeps those rules (review of 2026-11-13).
"scripts/**" = ["S101", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["berigna", "berigna_nautilus"]

[[tool.mypy.overrides]]
module = ["smartcard.*", "asn1crypto.*", "requests.*", "lxml.*", "signxml.*", "reportlab.*"]
ignore_missing_imports = true

# PyGObject has no type information in Debian: GTK classes are Any for mypy, so the interface
# may subclass them (ADR-0002, entorno y convenciones §3: "en ui, modo normal").
[[tool.mypy.overrides]]
module = ["gi", "gi.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["berigna.ui.*", "berigna_nautilus"]
disallow_subclassing_any = false
warn_return_any = false

[tool.coverage.run]
source = ["berigna", "berigna_nautilus"]
branch = true

[tool.coverage.report]
# RNF-MAN-02: at least 80 % for the package; critical signing/validation paths are reviewed
# separately and must stay fully covered (today: 100 % of berigna.core.token).
fail_under = 80
show_missing = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    # pyscard's SWIG binding on Python 3.13; not raised by berigna code.
    "ignore:builtin type Swig.* has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
]
markers = [
    "hil: requiere un lector y un DNIe reales; nunca se ejecuta en CI (BERIGNA_HIL=1 para activarlas)",
]
