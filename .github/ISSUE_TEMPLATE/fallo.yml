name: Fallo
description: berigna no hace lo que debería.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        > [!WARNING]
        > **No incluyas datos personales.** Ni tu PIN, ni tu número de DNI, ni certificados, ni documentos firmados con datos reales, ni capturas que los muestren. Esta incidencia es pública.
        >
        > Si es una vulnerabilidad, no la publiques aquí: sigue [SECURITY.md](https://github.com/noggalito/berigna/blob/main/SECURITY.md).
  - type: input
    id: version
    attributes:
      label: Versión de berigna
      description: Menú principal → Acerca de berigna, o la etiqueta o el commit si lo instalaste desde el código.
      placeholder: v0.3.0-rc.1
    validations:
      required: true
  - type: dropdown
    id: sistema
    attributes:
      label: Sistema
      options:
        - Debian 13 (trixie), amd64
        - Debian 13 (trixie), arm64
        - Otro (indícalo abajo)
    validations:
      required: true
  - type: dropdown
    id: dnie
    attributes:
      label: Versión del DNIe
      options:
        - DNIe 2.0
        - DNIe 1.0
        - DNIe 3.0
        - No lo sé
        - No aplica (sin tarjeta)
    validations:
      required: true
  - type: input
    id: lector
    attributes:
      label: Lector de tarjetas
      description: Marca y modelo, si lo sabes. El diagnóstico lo muestra.
  - type: textarea
    id: que-paso
    attributes:
      label: Qué pasó
      description: Incluye el código de error (ERR-xxx) si aparece.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Abrir un PDF de prueba
        2. Pulsar Firmar
        3. …
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Qué esperabas
    validations:
      required: true
  - type: textarea
    id: diagnostico
    attributes:
      label: Informe del diagnóstico
      description: Menú principal → Diagnóstico → Copiar el informe. Los números ya van enmascarados, pero revísalo antes de pegarlo.
      render: text
  - type: checkboxes
    id: datos
    attributes:
      label: Datos personales
      options:
        - label: He revisado que esta incidencia no contiene datos personales.
          required: true
